name: Build vLLM + ROCm
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel: stable (AMD matched set) or nightly (latest vLLM+ROCm)'
        required: false
        default: 'nightly'
        type: choice
        options: [nightly, stable]
      gfx_target:
        description: 'AMD GPU targets (comma-separated)'
        required: false
        default: 'gfx110X,gfx1151,gfx1150,gfx120X'
      create_release:
        description: 'Create a GitHub release after successful build'
        required: false
        default: true
        type: boolean
      force:
        description: 'Re-run even if this nightly was already qualified (bypass dedup)'
        required: false
        default: false
        type: boolean
      stable_vllm_ver:
        description: 'Stable channel: vLLM version to install (cp313 wheel at rocm.frameworks.amd.com/whl/gfx1151/vllm/)'
        required: false
        default: '0.19.1.dev3+rocm7.13.0.g72ed2b398.d20260513'
      omni:
        description: 'Also layer vLLM-Omni onto the bundle and release it as a separate vllm-omni* artifact (implies a build regardless of nightly dedup)'
        required: false
        default: false
        type: boolean

  pull_request:
    types: [opened, synchronize, reopened]

  schedule:
    # Daily: poll for a new nightly. The detect-nightly job dedups against the
    # qualification feed, so days with no new wheel cost only the cheap poll.
    - cron: '0 15 * * *'
    # Daily omni auto-build (gfx1151 only). Distinguished from the plain nightly
    # by github.event.schedule below; builds vLLM-Omni on the pinned base,
    # qualifies it (tier2_omni), and publishes the vllm-omni* release on green.
    # Offset 90 min so it queues behind the plain nightly on the shared
    # single-GPU dev_lab runner. Deduped by the detect-omni step against the
    # qualification feed (omni candidate tag), so an unchanged omni version costs
    # only the cheap poll — no daily rebuild/requalify/republish of the same tag.
    - cron: '30 16 * * *'

env:
  # Omni auto-build cron targets gfx1151 only (the qualified, hardware-validated
  # target); plain nightly + dispatch keep the full target set.
  GFX_TARGETS: ${{ github.event.inputs.gfx_target || (github.event.schedule == '30 16 * * *' && 'gfx1151') || 'gfx110X,gfx1151,gfx1150,gfx120X' }}
  # Channel is a run-level parameter (not a matrix axis): stable and nightly
  # have different triggers and different upstream sources, so they run as
  # separate workflow runs. Scheduled runs default to nightly.
  CHANNEL: ${{ github.event.inputs.channel || 'nightly' }}
  # When true, layer vLLM-Omni on top of the base bundle (built on the same
  # channel) and release it as a separate vllm-omni* artifact. vLLM-Omni is a
  # pure-Python layer; the omni bundle is the base bundle + vllm-omni + its deps
  # (see scripts/build_omni_layer.sh). Off for normal nightly/stable runs.
  OMNI: ${{ github.event.inputs.omni || (github.event.schedule == '30 16 * * *') || 'false' }}
  # Qualified base the omni layer builds on: detect-omni resolves the newest
  # vllm-omni release matching this base's major.minor from PyPI (0.25.x ->
  # vllm-omni 0.25.0rc1). Pinned to a base that passed full qualification
  # (run 31541098026) rather than tracking the latest nightly; bump when a
  # newer base qualifies AND a matching vllm-omni release exists. (Used in
  # the nightly install step below.)
  OMNI_BASE_VLLM_VER: "0.25.2.dev0+rocm7.15.0a20260724.g752a3a504.d20260724"

jobs:
  # Decide whether AMD has published a nightly vLLM wheel we have not already
  # qualified. Dedup key = the wheel's full version string, checked against the
  # published qualification feed (which records every run, pass OR fail). This
  # gates the pipeline so the daily cron only does real work when a genuinely
  # new nightly appears. No-op (is_new=true) for PRs and the stable channel.
  detect-nightly:
    runs-on: ubuntu-22.04
    outputs:
      is_new: ${{ steps.detect.outputs.is_new }}
      vllm_whl: ${{ steps.detect.outputs.vllm_whl }}
      vllm_ver: ${{ steps.detect.outputs.vllm_ver }}
      rocm_stamp: ${{ steps.detect.outputs.rocm_stamp }}
      omni_is_new: ${{ steps.detect-omni.outputs.omni_is_new }}
      omni_candidate_ver: ${{ steps.detect-omni.outputs.omni_candidate_ver }}
    steps:
    - name: Detect new nightly
      id: detect
      run: |
        set -uo pipefail
        IS_NEW=true
        if [ "$CHANNEL" = "nightly" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
          # RDNA line: this job gates the DAILY CRON, which is RDNA-driven. CDNA
          # targets resolve their own version in the build step from
          # device-all-cdna, so dedup here is deliberately RDNA-keyed.
          NIGHTLY_VLLM=https://rocm.frameworks-nightlies.amd.com/whl/device-all-rdna
          # AMD's nightly vLLM is cp314 (Python 3.14); the old cp313 line is frozen.
          WHL=$(curl -fsSL "$NIGHTLY_VLLM/vllm/" \
            | grep -oE 'vllm-[0-9][^"]*-cp314-cp314-linux_x86_64\.whl' \
            | sed 's/%2B/+/g' | sort | tail -1 || true)
          if [ -n "$WHL" ]; then
            VER=$(echo "$WHL" | sed -E 's/^vllm-(.*)-cp314-cp314-linux_x86_64\.whl$/\1/')
            STAMP=$(echo "$WHL" | grep -oE 'rocm[0-9.]+a[0-9]+' | head -1)
            echo "vllm_whl=$WHL"     >> "$GITHUB_OUTPUT"
            echo "vllm_ver=$VER"     >> "$GITHUB_OUTPUT"
            echo "rocm_stamp=$STAMP" >> "$GITHUB_OUTPUT"
            echo "newest nightly wheel: $WHL"
            # Dedup against the published feed (pass AND fail are recorded there,
            # so a known-bad nightly is not retried — only a new stamp is).
            FEED="https://raw.githubusercontent.com/${{ github.repository }}/qualification-data/qualification/index.json"
            SEEN=$(curl -fsSL "$FEED" 2>/dev/null | VER="$VER" python3 -c 'import sys,json,os; d=json.load(sys.stdin); print("SEEN" if any(b.get("vllm_version")==os.environ["VER"] and b.get("channel")=="nightly" for b in d.get("builds",[])) else "NEW")' 2>/dev/null || echo "NEW")
            if [ "$SEEN" = "SEEN" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
              IS_NEW=false
              echo "Already qualified $VER — skipping this run (dispatch with force=true to re-run)."
            elif [ "$SEEN" = "SEEN" ]; then
              echo "Already qualified $VER but force=true — re-running anyway."
            else
              echo "New nightly $VER — running the pipeline."
            fi
          else
            echo "::warning::no cp314 nightly wheel found; proceeding"
          fi
        else
          echo "channel=$CHANNEL event=${{ github.event_name }} — dedup not applicable; proceeding"
        fi
        echo "is_new=$IS_NEW" >> "$GITHUB_OUTPUT"

    # Omni dedup. The omni base is pinned (OMNI_BASE_VLLM_VER) and the omni
    # version auto-resolves to the newest vllm-omni matching the base's
    # major.minor, so the candidate release is fully determined BEFORE the build.
    # Dedup key = the omni candidate tag (vllm-omni{ver}-gfx1151), the same `tag`
    # the qualify job records in the feed for PASS AND FAIL — so an already-tried
    # omni version (green or red) is not rebuilt daily; only a new version (a base
    # bump or a new vllm-omni point release) runs. Fails OPEN, and force=true
    # bypasses, matching the nightly dedup above.
    - name: Detect omni candidate
      id: detect-omni
      if: env.OMNI == 'true' && github.event_name != 'pull_request'
      run: |
        set -uo pipefail
        OMNI_IS_NEW=true
        BASE_MM=$(echo "$OMNI_BASE_VLLM_VER" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
        OMNI_VER=$(BASE_MM="$BASE_MM" python3 - <<'PY'
        import json, os, urllib.request
        base = os.environ["BASE_MM"]
        try:
            d = json.load(urllib.request.urlopen("https://pypi.org/pypi/vllm-omni/json", timeout=30))
            cands = [v for v in d["releases"] if v.split("rc")[0].rsplit(".", 1)[0] == base]
            print(sorted(cands)[-1] if cands else "")
        except Exception:
            print("")
        PY
        )
        if [ -z "$OMNI_VER" ]; then
          echo "::warning::could not resolve a vllm-omni release for base $BASE_MM — proceeding (build resolves/fails loudly)"
        else
          CAND_TAG="vllm-omni${OMNI_VER}-gfx1151"
          echo "omni candidate: $OMNI_VER (feed tag $CAND_TAG)"
          FEED="https://raw.githubusercontent.com/${{ github.repository }}/qualification-data/qualification/index.json"
          SEEN=$(curl -fsSL "$FEED" 2>/dev/null | CAND_TAG="$CAND_TAG" python3 -c 'import sys,json,os; d=json.load(sys.stdin); print("SEEN" if any(b.get("tag")==os.environ["CAND_TAG"] for b in d.get("builds",[])) else "NEW")' 2>/dev/null || echo "NEW")
          if [ "$SEEN" = "SEEN" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            OMNI_IS_NEW=false
            echo "omni $OMNI_VER already qualified — skipping this run (dispatch with force=true to re-run)."
          elif [ "$SEEN" = "SEEN" ]; then
            echo "omni $OMNI_VER already qualified but force=true — re-running anyway."
          else
            echo "new omni $OMNI_VER — running the pipeline."
          fi
        fi
        echo "omni_candidate_ver=$OMNI_VER" >> "$GITHUB_OUTPUT"
        echo "omni_is_new=$OMNI_IS_NEW" >> "$GITHUB_OUTPUT"

  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      ubuntu_matrix: ${{ steps.set-matrix.outputs.ubuntu_matrix }}
      qualify_matrix: ${{ steps.set-matrix.outputs.qualify_matrix }}
      qualify_targets: ${{ steps.set-matrix.outputs.qualify_targets }}
      qualify_count: ${{ steps.set-matrix.outputs.qualify_count }}
      ephemeral_matrix: ${{ steps.set-matrix.outputs.ephemeral_matrix }}
      ephemeral_count: ${{ steps.set-matrix.outputs.ephemeral_count }}
    steps:
    - name: Set matrix
      id: set-matrix
      run: |
        targets="${{ env.GFX_TARGETS }}"
        matrix_targets=$(echo "$targets" \
          | tr ',' '\n' \
          | sed 's/^ *//;s/ *$//' \
          | jq -R . \
          | jq -s '{gfx_target: .}' \
          | jq -c)
        echo "ubuntu_matrix=$matrix_targets" >> $GITHUB_OUTPUT
        echo "Generated matrix: $matrix_targets"

        # Targets with qualification hardware, mapped to every pool that owns
        # some. The qualify jobs run one leg per selected target that appears
        # here; targets absent from this registry build and release exactly as
        # before (qualify skips them -> release ungated, unchanged). Adding
        # hardware for a new target (e.g. a CDNA box for gfx942) is a one-line
        # addition to this map.
        #
        # A pool is addressed one of two ways, and the difference is not
        # cosmetic:
        #   dev_lab    a runner GROUP -- a shared, persistent box, selected
        #              with `group:` so a leg cannot land on a Linux box in
        #              another group the repo can also see (Default is
        #              visibility:all).
        #   ephemeral  a LABEL pool -- per-job VMs from an orchestrator, which
        #              registers its runners to the REPO. A repo-registered
        #              runner is always in the repo's Default group, so
        #              `group:` can never select it; it is reached by its
        #              specific labels instead.
        # 'ephemeral' is the one pool name that means labels rather than a
        # group, which is why it is split out below.
        QUALIFICATION_POOLS='{"gfx1151":["dev_lab","ephemeral"]}'
        selected=$(echo "$targets" \
          | tr ',' '\n' \
          | sed 's/^ *//;s/ *$//' \
          | jq -R . \
          | jq -sc 'unique')

        # One leg per (target, runner group) -- the release path.
        qualify_matrix=$(echo "$selected" \
          | jq -c --argjson q "$QUALIFICATION_POOLS" \
              '{include: [.[] | . as $t | ($q[$t] // [])[]
                          | select(. != "ephemeral")
                          | {gfx: $t, runner_group: .}]}')
        # One leg per target the ephemeral pool can serve. Same registry, so a
        # target can never be soaked on hardware it is not qualified on.
        ephemeral_matrix=$(echo "$selected" \
          | jq -c --argjson q "$QUALIFICATION_POOLS" \
              '{include: [.[] | . as $t | ($q[$t] // [])[]
                          | select(. == "ephemeral")
                          | {gfx_target: $t}]}')
        # JSON array (not a comma list): consumers use fromJson() set membership,
        # so no target string can substring-match another.
        qualify_targets=$(echo "$qualify_matrix" | jq -c '[.include[].gfx]')
        qualify_count=$(echo "$qualify_matrix" | jq -r '.include | length')
        ephemeral_count=$(echo "$ephemeral_matrix" | jq -r '.include | length')
        echo "qualify_matrix=$qualify_matrix" >> $GITHUB_OUTPUT
        echo "qualify_targets=$qualify_targets" >> $GITHUB_OUTPUT
        echo "qualify_count=$qualify_count" >> $GITHUB_OUTPUT
        echo "ephemeral_matrix=$ephemeral_matrix" >> $GITHUB_OUTPUT
        echo "ephemeral_count=$ephemeral_count" >> $GITHUB_OUTPUT
        echo "Qualify matrix: $qualify_matrix"
        echo "Ephemeral matrix: $ephemeral_matrix"

  build-ubuntu:
    # Target the dev_lab runner GROUP explicitly, not just labels. The org's
    # Default group is visibility:all, so a bare [self-hosted, Linux] also
    # matches Linux boxes in other groups (stx / sjlab / Default) the repo can
    # see — runs landed on a non-dev_lab box. `group: dev_lab` + the Linux label
    # selects only the dev_lab Linux box (currently ta-devlab-halo-03) with no
    # name-pin, so it survives re-image/rename as long as the box stays in the
    # group. AMD's frameworks-nightlies host allowlists these boxes' egress but
    # 403s GitHub-hosted runner IPs, so the nightly vLLM wheel must be fetched
    # here. Build needs only network + pip (no GPU); it shares the box with
    # qualify, which runs after via `needs`.
    runs-on:
      group: dev_lab
      labels: [self-hosted, Linux]
    needs: [prepare-matrix, detect-nightly]
    # Skip the whole build (and everything downstream — qualify/create-release
    # cascade off a skipped build) when this build has already been qualified.
    # Two mutually-exclusive dedup keys, selected by mode:
    #   omni run   -> omni_is_new (omni candidate tag vs the feed)
    #   plain run  -> is_new      (nightly wheel version vs the feed)
    # Both are 'true' for a genuinely new candidate or when force=true.
    # Also skip on pull_request: this is a heavy multi-target repackage that runs
    # on the shared dev_lab GPU pool, so PR pushes must not tie those boxes up
    # (and qualify/create-release already skip PRs). Runs on dispatch + cron.
    # "omni run" mirrors the env.OMNI predicate (env isn't available at job level).
    if: >-
      github.event_name != 'pull_request' &&
      (
        (
          (github.event.inputs.omni == 'true' || github.event.schedule == '30 16 * * *')
            && needs.detect-nightly.outputs.omni_is_new == 'true'
        ) || (
          !(github.event.inputs.omni == 'true' || github.event.schedule == '30 16 * * *')
            && needs.detect-nightly.outputs.is_new == 'true'
        )
      )
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.ubuntu_matrix)}}
      fail-fast: false
    outputs:
      vllm_version: ${{ steps.build.outputs.vllm_version }}
      torch_version: ${{ steps.build.outputs.torch_version }}
      # Non-empty only on omni builds; create-release uses it to pick the tag.
      omni_version: ${{ steps.build.outputs.omni_version }}

    steps:
    # The repo has to be on disk before a local action can be resolved.
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build the bundle
      id: build
      uses: ./.github/actions/build-vllm-bundle
      with:
        gfx_target: ${{ matrix.gfx_target }}
        # The release path's artifact name, unchanged: create-release and
        # qualify both resolve this exact string.
        artifact_name: vllm-ubuntu-rocm-${{ matrix.gfx_target }}-x64
        retention_days: '30'
        channel: ${{ env.CHANNEL }}
        omni: ${{ env.OMNI }}
        omni_base_vllm_ver: ${{ env.OMNI_BASE_VLLM_VER }}
        vllm_ver: ${{ needs.detect-nightly.outputs.vllm_ver }}
        rocm_stamp: ${{ needs.detect-nightly.outputs.rocm_stamp }}
        stable_vllm_ver: ${{ github.event.inputs.stable_vllm_ver }}

  # 16-test qualification, one leg per selected target that has qualification
  # hardware (prepare-matrix qualify_matrix: target -> self-hosted runner group;
  # currently gfx1151 -> dev_lab). Targets the runner GROUP (not just labels) so
  # a leg can't land on a Linux box in another group the repo can also see
  # (Default is visibility:all) — see build-ubuntu.
  # Runs the scripts/qualify harness against the built bundle:
  #   tier0 static (6) + tier1 hardware smoke (5) + tier2 functional inference (5)
  # = 16 tests, then aggregates them into a qualification report and a promotion
  # decision. Releases are gated on promotion (see create-release `needs`).
  qualify:
    needs: [prepare-matrix, build-ubuntu]
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.qualify_matrix) }}
      fail-fast: false
    runs-on:
      group: ${{ matrix.runner_group }}
      labels: [self-hosted, Linux]
    # Runs on release builds AND on omni dispatches (omni is experimental —
    # always qualify it, even as a no-publish dry run; release stays gated on
    # create_release in the create-release job). Skips PRs and dispatches whose
    # selected targets have no qualification hardware (nothing to test →
    # release ungated, matching the previous gfx1151-only behavior).
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare-matrix.outputs.qualify_count != '0' &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.event.inputs.create_release == 'true' ||
            github.event.inputs.create_release == null ||
            github.event.inputs.omni == 'true'
          )
        )
      )
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Qualify the bundle
      id: qualify
      uses: ./.github/actions/qualify-vllm-bundle
      with:
        gfx: ${{ matrix.gfx }}
        build_artifact: vllm-ubuntu-rocm-${{ matrix.gfx }}-x64
        # publish-qualification globs `qualification-*`; this is the name it
        # is meant to pick up.
        report_artifact_name: qualification-${{ matrix.gfx }}
        channel: ${{ env.CHANNEL }}
        omni: ${{ env.OMNI }}
        vllm_version: ${{ needs.build-ubuntu.outputs.vllm_version }}
        omni_version: ${{ needs.build-ubuntu.outputs.omni_version }}

  # ==========================================================================
  # The same build and the same qualification, on the AMD DevLab ephemeral pool
  #
  # These two jobs call the SAME composite actions the dev_lab jobs above call.
  # That is the whole design: the ephemeral pool is a different place to run
  # the steps, not a different set of steps. Between #30, #32 and #33 those
  # steps changed four times in one week, so a copy would have been stale
  # before it landed -- and would have gone red for reasons that have nothing
  # to do with this pool.
  #
  # The pool provisions a Strix Halo (gfx1151) VM per job from a golden image
  # and destroys it afterwards, so each run starts from a known state.
  #
  # runs-on is bare labels with no `group:` on purpose. These runners are
  # registered to the repo, and a repo-registered runner is always in the
  # repo's Default group -- `group:` can never select it. 'strix-halo' and
  # 'ephemeral' are the specific labels the orchestrator publishes; the pool
  # deliberately refuses jobs that name only generic labels, so a bare
  # [self-hosted, Linux] would not reach it.
  #
  # Two things differ beyond runs-on, both deliberate:
  #
  #   gfx1151 only. That is the silicon this pool has, and it comes from the
  #   same QUALIFICATION_POOLS registry that drives the dev_lab legs.
  #
  #   No dedup gate. The release path skips a build when detect-nightly says
  #   the wheel has already been qualified. That is right for a shared box and
  #   wrong for a pool being soaked -- it would idle these jobs on every day
  #   AMD does not publish, which is most days.
  #
  # Nothing in the release path can see them: they need each other and not
  # build-ubuntu, publish-qualification still needs qualify, create-release is
  # still gated on qualify, and both artifacts are prefixed ephemeral- so they
  # fall outside every name and glob the release jobs resolve. continue-on-error
  # plus no downstream needs means a red soak leg cannot fail the workflow or
  # block a release. Ephemeral artifacts keep 7 days rather than 30 -- an 11 GB
  # bundle rebuilt daily is not worth a month when nothing downstream reads it.
  #
  # To call the trial off: delete these two jobs and the 'ephemeral' entry in
  # QUALIFICATION_POOLS. Nothing else refers to them.
  # ==========================================================================
  build-ubuntu-ephemeral:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    needs: [prepare-matrix, detect-nightly]
    # A red soak leg is a signal, not a release blocker.
    continue-on-error: true
    # Every schedule and every dispatch, PRs excluded (an 11 GB build per push
    # is not what anyone is asking for). No dedup gate -- see above. The count
    # guard keeps the job off runs whose targets have no ephemeral hardware,
    # and an empty matrix is an error rather than a skip.
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare-matrix.outputs.ephemeral_count != '0'
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.ephemeral_matrix) }}
      fail-fast: false
    outputs:
      vllm_version: ${{ steps.build.outputs.vllm_version }}
      omni_version: ${{ steps.build.outputs.omni_version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build the bundle
      id: build
      uses: ./.github/actions/build-vllm-bundle
      with:
        gfx_target: ${{ matrix.gfx_target }}
        # Prefixed so it falls outside every name the release jobs resolve.
        artifact_name: ephemeral-vllm-ubuntu-rocm-${{ matrix.gfx_target }}-x64
        retention_days: '7'
        channel: ${{ env.CHANNEL }}
        omni: ${{ env.OMNI }}
        omni_base_vllm_ver: ${{ env.OMNI_BASE_VLLM_VER }}
        vllm_ver: ${{ needs.detect-nightly.outputs.vllm_ver }}
        rocm_stamp: ${{ needs.detect-nightly.outputs.rocm_stamp }}
        stable_vllm_ver: ${{ github.event.inputs.stable_vllm_ver }}

  qualify-ephemeral:
    runs-on: [self-hosted, Linux, strix-halo, ephemeral]
    needs: [prepare-matrix, build-ubuntu-ephemeral]
    continue-on-error: true
    # continue-on-error on the build leg reports success to `needs` even when
    # it failed, so this can start after a failed build and stop at the
    # download. That costs one short VM and keeps the run green, which is the
    # right trade for a soak.
    if: >-
      github.event_name != 'pull_request' &&
      needs.prepare-matrix.outputs.ephemeral_count != '0'
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.ephemeral_matrix) }}
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Qualify the bundle
      id: qualify
      uses: ./.github/actions/qualify-vllm-bundle
      with:
        gfx: ${{ matrix.gfx_target }}
        build_artifact: ephemeral-vllm-ubuntu-rocm-${{ matrix.gfx_target }}-x64
        # Outside publish-qualification's `qualification-*` glob on purpose:
        # soak results must not reach the published feed.
        report_artifact_name: ephemeral-qualification-${{ matrix.gfx_target }}
        channel: ${{ env.CHANNEL }}
        omni: ${{ env.OMNI }}
        vllm_version: ${{ needs.build-ubuntu-ephemeral.outputs.vllm_version }}
        omni_version: ${{ needs.build-ubuntu-ephemeral.outputs.omni_version }}

  # Publish the qualification result (pass OR fail) to the qualification-data
  # branch so the external dashboard can poll it. Runs on a hosted runner (the
  # GPU box has no gh/git tooling). Contract: docs/qualification-feed.md.
  publish-qualification:
    needs: qualify
    if: always() && (needs.qualify.result == 'success' || needs.qualify.result == 'failure')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # Optional. When set, the summary's prose is polished by an LLM pass;
      # absent, the deterministic summary (written by aggregate) is published.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
    - name: Checkout repository (for the publish script + schema doc)
      uses: actions/checkout@v4
      with:
        path: repo

    - name: Download qualification reports
      uses: actions/download-artifact@v4
      with:
        # One artifact per qualified target; each lands in report/qualification-<gfx>/
        # (merge-multiple stays off on purpose: every leg names its report
        # qualification-report.json, so merging would clobber).
        pattern: qualification-*
        path: report

    - name: Enrich summary prose (optional, best-effort)
      # Only when the key is configured. The deterministic summary is already
      # in the report; this rewrites only its prose and never fails the job.
      if: env.ANTHROPIC_API_KEY != ''
      run: |
        found=0
        for rpt in report/qualification-*/qualification-report.json; do
          [ -f "$rpt" ] || continue
          if [ "$found" = 0 ]; then
            python3 -m pip install --quiet --disable-pip-version-check anthropic \
              || { echo "::warning::pip install anthropic failed; skipping enrichment"; exit 0; }
          fi
          found=1
          python3 repo/scripts/qualify/enrich_summary.py \
            --report "$rpt" \
            --model claude-haiku-4-5 || true
        done
        [ "$found" = 1 ] || echo "no report to enrich"

    - name: Publish to qualification-data branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        reports=$(ls report/qualification-*/qualification-report.json 2>/dev/null || true)
        if [ -z "$reports" ]; then
          echo "::warning::no qualification-report.json in any artifact; nothing to publish"
          exit 0
        fi
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        BRANCH="qualification-data"

        # Race-safe: each attempt re-clones the latest branch, re-applies our
        # idempotent (build_id-keyed) upsert, and pushes; a rejected push (branch
        # moved under us) just retries on top of the new tip.
        pushed=0
        for attempt in 1 2 3 4 5; do
          rm -rf data
          if git clone --depth 1 --branch "$BRANCH" "$REPO_URL" data 2>/dev/null; then
            echo "cloned existing $BRANCH"
          else
            echo "creating orphan $BRANCH"
            git clone --depth 1 "$REPO_URL" data
            git -C data checkout --orphan "$BRANCH"
            git -C data rm -rf . >/dev/null 2>&1 || true
          fi

          for rpt in $reports; do
            python3 repo/scripts/publish_qualification.py \
              --report "$rpt" \
              --data-dir data/qualification \
              --run-url "$RUN_URL"
          done
          # Keep the contract doc alongside the data on the branch.
          cp repo/docs/qualification-feed.md data/qualification/SCHEMA.md

          git -C data add -A
          if git -C data diff --cached --quiet; then
            echo "no changes to publish"; pushed=1; break
          fi
          git -C data commit -q -m "qualification: run ${{ github.run_id }}"
          if git -C data push origin "$BRANCH" 2>/dev/null; then
            pushed=1; break
          fi
          echo "push attempt $attempt failed (branch moved?); retrying"; sleep $((attempt * 3))
        done
        [ "$pushed" = 1 ] || { echo "::error::failed to publish after retries"; exit 1; }
        echo "Feed published:"
        echo "  https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/qualification/index.json"

  create-release:
    needs: [prepare-matrix, build-ubuntu, qualify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.ubuntu_matrix)}}
      fail-fast: false
    if: |
      always() &&
      needs.build-ubuntu.result == 'success' &&
      (needs.qualify.result == 'success' || needs.qualify.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == null) ||
       github.event_name == 'schedule')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifact for ${{ matrix.gfx_target }}
      uses: actions/download-artifact@v4
      with:
        name: vllm-ubuntu-rocm-${{ matrix.gfx_target }}-x64
        path: ./artifact

    - name: Generate release tag
      id: generate-tag
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VLLM_VERSION="${{ needs.build-ubuntu.outputs.vllm_version }}"
        TORCH_VERSION="${{ needs.build-ubuntu.outputs.torch_version }}"
        OMNI_VERSION="${{ needs.build-ubuntu.outputs.omni_version }}"
        TARGET="${{ matrix.gfx_target }}"

        # Extract ROCm version from torch version string
        ROCM_VERSION=$(echo "$TORCH_VERSION" | grep -oP 'rocm[\d.]+' || echo "rocm")

        # Some AMD stable wheels stamp __version__ with +local metadata; stable tags
        # carry the public version only. Nightly keeps the full version by design.
        if [ "$CHANNEL" = "stable" ]; then
          VLLM_VERSION="${VLLM_VERSION%%+*}"
        fi

        # Omni builds release as a SEPARATE artifact, tagged by the vllm-omni
        # version so it never collides with the plain-vLLM bundle:
        #   vllm-omni{omni_ver}-{rocm_version}-{gfx_target}
        # Plain builds keep the existing scheme:
        #   vllm{version}-{rocm_version}-{gfx_target}  e.g. vllm0.19.0-rocm7.12.0-gfx1150
        if [ -n "$OMNI_VERSION" ]; then
          TAG="vllm-omni${OMNI_VERSION}-${ROCM_VERSION}-${TARGET}"
        else
          TAG="vllm${VLLM_VERSION}-${ROCM_VERSION}-${TARGET}"
        fi
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "Generated release tag: ${TAG}"

    - name: Create archive (split if >1.9 GB for GitHub release limit)
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        MAX_SIZE=1900  # MB — GitHub limit is 2 GB per asset
        base="${TAG}-x64"

        echo "Creating: ${base}.tar.gz"
        # The build job already produced the release archive (with ROCm symlinks
        # preserved); reuse it instead of re-tarring the artifact, so the release
        # asset structure stays identical.
        src=$(find ./artifact -name '*.tar.gz' | head -n1)
        [ -n "$src" ] || { echo "::error::no release archive in artifact for ${{ matrix.gfx_target }}"; exit 1; }
        cp "$src" "${base}.tar.gz"
        size_mb=$(du -m "${base}.tar.gz" | cut -f1)
        echo "Archive size: ${size_mb} MB"

        if [ "$size_mb" -gt "$MAX_SIZE" ]; then
          echo "Splitting into ${MAX_SIZE}MB parts..."
          # 1-based, 2-digit numeric suffixes -> {base}.part01.tar.gz, ...
          split -b ${MAX_SIZE}M --numeric-suffixes=1 -a 2 \
            --additional-suffix=.tar.gz \
            "${base}.tar.gz" "${base}.part"
          rm "${base}.tar.gz"

          # Rename to HF-style partNN-of-MM.tar.gz, and emit a tiny manifest
          # ({base}.partcount, one line with MM) so consumers can determine
          # MM with a single HTTP GET instead of querying the GitHub Releases
          # API (which is rate-limited to 60 req/hr per IP unauthenticated).
          parts=( "${base}".part*.tar.gz )
          total=${#parts[@]}
          total_padded=$(printf "%02d" "$total")
          for f in "${parts[@]}"; do
            nn="${f##*.part}"; nn="${nn%%.tar.gz}"
            mv "$f" "${base}.part${nn}-of-${total_padded}.tar.gz"
          done
          echo "$total" > "${base}.partcount"

          echo "Parts created:"
          ls -la "${base}".part*
          echo "Manifest:"
          cat "${base}.partcount"
        fi

        echo "=== Release assets ==="
        ls -la *.tar.gz *.partcount 2>/dev/null || echo "No archives"

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        VLLM_VERSION="${{ needs.build-ubuntu.outputs.vllm_version }}"
        TORCH_VERSION="${{ needs.build-ubuntu.outputs.torch_version }}"
        TARGET="${{ matrix.gfx_target }}"

        upload_files=$(ls -1 *.tar.gz *.partcount 2>/dev/null | tr '\n' ' ')
        echo "Files to upload: $upload_files"

        # Delete existing release with same tag (idempotent rebuilds)
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

        gh release create "$TAG" \
          --title "$TAG" \
          --notes "**GPU Target**: $TARGET
        **vLLM Version**: $VLLM_VERSION
        **PyTorch Version**: $TORCH_VERSION
        **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

        Portable vLLM build for $TARGET. Includes bundled Python, PyTorch ROCm, and ROCm runtime. No separate installation required." \
          $upload_files

    - name: Attach qualification report to release
      # Co-locate the qualification proof with the shippable artifact, for any
      # target that was hardware-qualified this run; best-effort so it never
      # fails the release.
      if: contains(fromJson(needs.prepare-matrix.outputs.qualify_targets), matrix.gfx_target)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ steps.generate-tag.outputs.tag }}"
        rm -rf qual && mkdir -p qual
        if ! gh run download "${{ github.run_id }}" -n "qualification-${{ matrix.gfx_target }}" -D qual --repo "${{ github.repository }}"; then
          echo "::warning::qualification artifact not found; skipping attach"; exit 0
        fi
        if [ -f qual/qualification-report.json ]; then
          cp qual/qualification-report.json "qualification-report-${TAG}.json"
          gh release upload "$TAG" "qualification-report-${TAG}.json" --clobber
          echo "Attached qualification-report-${TAG}.json to $TAG"
        fi
